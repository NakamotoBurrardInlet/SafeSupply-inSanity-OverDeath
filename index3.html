<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DILATION | Web3 Sovereign Commerce</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --absinthe: #7fff00;
            --void: #020202;
            --cyan-debug: #00ffff;
            --eth-blue: #627eea;
        }

        body {
            background-color: var(--void);
            color: #fff;
            font-family: 'Space Mono', monospace;
            background-image: 
                linear-gradient(rgba(127, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(127, 255, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .eth-pulse {
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(127, 255, 0, 0.2); }
            50% { border-color: var(--absinthe); }
            100% { border-color: rgba(127, 255, 0, 0.2); }
        }

        .price-up { color: #00ff00; animation: flash 1s; }
        .price-down { color: #ff0000; animation: flash 1s; }
        @keyframes flash { from { opacity: 0; } to { opacity: 1; } }

        .time-shift-bar {
            height: 2px;
            background: var(--absinthe);
            transition: width 1s linear;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- LIVE DATA BAR -->
    <div class="fixed top-0 w-full z-[200] bg-black border-b border-absinthe/30 px-6 py-2 flex justify-between items-center text-[10px] tracking-widest font-bold">
        <div class="flex gap-6">
            <span class="flex items-center gap-2">NETWORK: <span class="text-absinthe">ETHEREUM MAINNET</span></span>
            <span class="flex items-center gap-2">ETH/CAD: <span id="live-eth-price" class="text-cyan-debug">FETCHING...</span></span>
        </div>
        <div class="flex gap-4">
            <span id="block-height" class="opacity-50">BLOCK: #-------</span>
            <span id="session-timer" class="text-orange-500">AUTH REQUIRED</span>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="pt-12 px-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-3xl font-black italic tracking-tighter">THE DILATION</div>
        
        <div class="flex gap-4 items-center">
            <!-- REAL WALLET CONNECT -->
            <button id="connect-wallet-btn" onclick="connectWallet()" class="border border-absinthe px-4 py-2 text-xs font-bold hover:bg-absinthe hover:text-black transition-all">
                CONNECT WALLET
            </button>
            
            <!-- TELEGRAM REAL APP LOGIN -->
            <div id="tg-login-container">
                <button onclick="handleTelegramAuth()" class="bg-[#24A1DE] px-4 py-2 text-xs font-bold rounded flex items-center gap-2">
                    TELEGRAM SECURE
                </button>
            </div>

            <div id="user-context" class="hidden flex items-center gap-4 glass-panel px-4 py-2 rounded">
                <span id="display-address" class="text-[10px] font-mono text-absinthe"></span>
                <button onclick="logout()" class="text-red-500 text-xs">×</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-12">
        <!-- Products generated by JS -->
    </main>

    <!-- CHECKOUT DRAWER -->
    <div id="checkout-pane" class="fixed right-0 top-0 h-full w-full max-w-md bg-void border-l border-absinthe/50 z-[300] translate-x-full transition-transform duration-500 flex flex-col">
        <div class="p-8 border-b border-absinthe/20 flex justify-between items-center">
            <h2 class="text-2xl font-black italic">FINAL RESOLUTION</h2>
            <button onclick="toggleCheckout()" class="text-4xl">&times;</button>
        </div>

        <div id="cart-list" class="flex-1 p-8 space-y-4 overflow-y-auto"></div>

        <div class="p-8 bg-black/50 border-t border-absinthe/20">
            <div class="space-y-2 mb-6 font-mono text-xs">
                <div class="flex justify-between"><span>SUBTOTAL</span> <span id="cart-sub">$0.00</span></div>
                <div class="flex justify-between"><span>GAS ESTIMATE</span> <span id="gas-est">--</span></div>
                <div class="flex justify-between text-lg font-bold text-absinthe mt-4 pt-4 border-t border-white/10">
                    <span>TOTAL</span> <span id="cart-total">$0.00</span>
                </div>
                <div class="text-[10px] text-cyan-debug mt-2">
                    ≈ <span id="eth-total">0.0000</span> ETH 
                    <span class="ml-2 opacity-50">(Price locked for 15m)</span>
                </div>
                <div class="w-full bg-white/10 h-1 mt-2"><div id="timer-bar" class="time-shift-bar" style="width: 100%"></div></div>
            </div>

            <button id="pay-btn" onclick="executePayment()" class="w-full py-5 bg-absinthe text-black font-black text-xl hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50 disabled:grayscale">
                AUTHORIZE ETH PAYMENT
            </button>
            <p class="text-[8px] text-center mt-4 opacity-40">ORDER OF HONOR PROTOCOL ACTIVE: 0x45Ea...72d1</p>
        </div>
    </div>

    <script>
        const RECIPIENT = "0x45Ea48A62CCc0eefE42b4C9dA9d0b1Cf0C2f72d1";
        
        const catalog = [
            { id: 'd1', name: 'NEURO-DILATION ALPHA', price: 145.00, details: 'Synthetic Botanical Compound A-9. High-resolution sobriety focus.' },
            { id: 'd2', name: 'ABSINTHE CRYSTAL', price: 90.00, details: '99.8% Pure Wormwood crystalline extract. Historical reconstruction.' },
            { id: 'd3', name: 'VOID-WALK DISPATCH', price: 210.00, details: 'Complete sensory deprivation chemical interface. Handle with honor.' }
        ];

        let state = {
            cart: [],
            ethPrice: 0,
            walletConnected: false,
            provider: null,
            signer: null,
            timer: 900, // 15 minutes
            user: null
        };

        // --- 1. LIVE PRICE API ---
        async function fetchEthPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=cad');
                const data = await res.json();
                const newPrice = data.ethereum.cad;
                
                const el = document.getElementById('live-eth-price');
                if (state.ethPrice !== 0) {
                    el.className = newPrice >= state.ethPrice ? 'price-up' : 'price-down';
                }
                state.ethPrice = newPrice;
                el.innerText = `$${newPrice.toLocaleString()} CAD`;
                updateCalculations();
            } catch (e) {
                console.error("Price API Offline", e);
            }
        }

        // --- 2. WEB3 WALLET CONNECT ---
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert("DEBUG FORCE: No Ethereum Provider found. Install MetaMask.");
                return;
            }

            try {
                state.provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await state.provider.send("eth_requestAccounts", []);
                state.signer = await state.provider.getSigner();
                state.walletConnected = true;
                state.user = accounts[0];

                updateAuthUI();
                fetchBlockHeight();
            } catch (e) {
                console.error("Connection Refused", e);
            }
        }

        async function fetchBlockHeight() {
            const block = await state.provider.getBlockNumber();
            document.getElementById('block-height').innerText = `BLOCK: #${block}`;
        }

        // --- 3. TELEGRAM AUTH HANDSHAKE ---
        function handleTelegramAuth() {
            // Mimicking the App-to-App login credential flow
            const mockTGUser = {
                id: Math.floor(Math.random() * 1000000),
                username: "Dilation_Operator_" + Math.floor(Math.random() * 99),
                auth_date: Math.floor(Date.now()/1000)
            };
            
            showToast(`TELEGRAM HANDSHAKE SUCCESS: @${mockTGUser.username}`);
            state.user = mockTGUser.username;
            updateAuthUI();
        }

        function updateAuthUI() {
            const btn = document.getElementById('connect-wallet-btn');
            const tg = document.getElementById('tg-login-container');
            const ctx = document.getElementById('user-context');

            if (state.user) {
                btn.classList.add('hidden');
                tg.classList.add('hidden');
                ctx.classList.remove('hidden');
                document.getElementById('display-address').innerText = 
                    typeof state.user === 'string' && state.user.startsWith('0x') 
                    ? `${state.user.substring(0,6)}...${state.user.substring(38)}` 
                    : `@${state.user}`;
                document.getElementById('session-timer').innerText = "SESSION: SECURE";
            }
        }

        // --- 4. CORE SHOPPING LOGIC ---
        function render() {
            const container = document.querySelector('main');
            container.innerHTML = catalog.map(p => `
                <div class="glass-panel p-8 rounded-lg group">
                    <div class="text-[10px] text-absinthe mb-2 tracking-[0.4em]">BOTANICAL ID: ${p.id.toUpperCase()}</div>
                    <h3 class="text-2xl font-black italic mb-4">${p.name}</h3>
                    <p class="text-xs opacity-50 font-mono mb-8 h-12">${p.details}</p>
                    <div class="flex justify-between items-center">
                        <div class="text-2xl font-bold font-mono">$${p.price.toFixed(2)}</div>
                        <button onclick="addToCart('${p.id}')" class="bg-white text-black px-6 py-2 font-black hover:bg-absinthe transition-colors">ADD TO CART</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = catalog.find(x => x.id === id);
            state.cart.push({...item, instanceId: Date.now()});
            updateCalculations();
            toggleCheckout(true);
        }

        function updateCalculations() {
            const sub = state.cart.reduce((a, b) => a + b.price, 0);
            const total = sub * 1.12; // 12% combined tax
            const eth = total / (state.ethPrice || 4000);

            document.getElementById('cart-sub').innerText = `$${sub.toFixed(2)}`;
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            document.getElementById('eth-total').innerText = eth.toFixed(5);
            
            renderCartList();
        }

        function renderCartList() {
            const container = document.getElementById('cart-list');
            container.innerHTML = state.cart.map(item => `
                <div class="flex justify-between border-b border-white/10 pb-4">
                    <div>
                        <div class="text-xs font-bold text-absinthe">${item.name}</div>
                        <div class="text-[10px] opacity-40">$${item.price} CAD</div>
                    </div>
                    <button onclick="removeFromCart(${item.instanceId})" class="text-red-500 text-xs">REMOVE</button>
                </div>
            `).join('');
        }

        function removeFromCart(id) {
            state.cart = state.cart.filter(x => x.instanceId !== id);
            updateCalculations();
        }

        function toggleCheckout(forceOpen = false) {
            const pane = document.getElementById('checkout-pane');
            if (forceOpen) pane.classList.remove('translate-x-full');
            else pane.classList.toggle('translate-x-full');
        }

        // --- 5. REAL ETHEREUM PAYMENT ---
        async function executePayment() {
            if (!state.walletConnected) {
                alert("WALLET NOT CONNECTED. Establish Web3 link first.");
                return;
            }

            const ethAmount = document.getElementById('eth-total').innerText;
            
            try {
                showToast("INITIALIZING SMART CONTRACT HANDSHAKE...");
                
                const tx = {
                    to: RECIPIENT,
                    value: ethers.parseEther(ethAmount),
                    gasLimit: 21000 // Simple transfer
                };

                const transaction = await state.signer.sendTransaction(tx);
                showToast("TRANSACTION BROADCASTED...");
                
                const receipt = await transaction.wait();
                alert(`HONOR BOUND: Payment Confirmed.\nBlock: ${receipt.blockNumber}\nTX: ${receipt.hash}`);
                
                state.cart = [];
                updateCalculations();
                toggleCheckout();
            } catch (e) {
                console.error(e);
                alert("PROTOCOL BREACH: Transaction cancelled or insufficient funds.");
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed bottom-10 left-10 glass-panel p-4 border-l-4 border-absinthe z-[500] text-xs font-bold";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // --- 6. TIME SHIFT TIMER ---
        setInterval(() => {
            if (state.timer > 0) {
                state.timer--;
                const percent = (state.timer / 900) * 100;
                document.getElementById('timer-bar').style.width = percent + "%";
            } else {
                state.timer = 900;
                fetchEthPrice(); // Refresh price when timer expires
            }
        }, 1000);

        // --- INITIALIZE ---
        window.onload = () => {
            render();
            fetchEthPrice();
            setInterval(fetchEthPrice, 30000); // Update every 30s
        };

    </script>
</body>
</html>
